name: Veille OSINT Europe V3

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Envoyer seulement un message de test Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: europe-osint-state
  cancel-in-progress: false

jobs:
  surveillance:
    runs-on: ubuntu-latest
    steps:
      - name: Charger le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lancer la surveillance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram || 'false' }}
        run: python monitor.py
      - name: Sauvegarder l'historique
        if: success() && inputs.test_telegram != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: OSINT state [skip ci]'
            git pull --rebase
            git push
          fi
